<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Image</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      text-align: center;
      padding-top: 2rem;
    }

   .close-wrapper {
  position: absolute;
  top: 20px;
  right: 30px;
  width: 2.5rem;
  height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.close-button {
  font-size: 2.5rem;
  font-weight: bold;
  color: #6b6b6b;
  text-decoration: none;
  line-height: 1;
  cursor: pointer;
  display: inline-block;
  padding: 0;
}
    .close-button:hover {
      color: black;
    }

    .image-container {
      position: relative;
      display: inline-block;
    }

    img {
      max-width: 90%;
      height: auto;
      margin-top: 2rem;
    }
    .pdf-viewer {
  width: 90vw;
  height: 90vh;
  margin-top: 2rem;
  border: none;
}
  </style>
</head>
<body>


<!-- Positions x button to link to home area -->
<div class="close-wrapper">
  <a href="index.html" class="close-button">&times;</a>
</div>

  <div class="image-container">
    <iframe src="assets/ABeck CV2025 GIS Final.pdf" class="pdf-viewer" frameborder="0"></iframe>

  </div>

</body>
</html>
